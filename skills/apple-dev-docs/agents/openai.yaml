interface:
  display_name: "Apple Dev Docs"
  short_description: "Search Apple developer documentation and WWDC content with semantic RAG"
  default_prompt: "Use available Apple RAG MCP tools or the apple-rag CLI to search official Apple documentation, fetch full content when needed, and answer with concise, cited guidance. Respect the server's account and quota state."

dependencies:
  tools:
    - type: "mcp"
      value: "apple-rag-mcp"
      description: "Apple Developer Documentation RAG MCP server"
      transport: "streamable_http"
      url: "https://mcp.apple-rag.com"
