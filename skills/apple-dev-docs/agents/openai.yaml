interface:
  display_name: "Apple RAG"
  short_description: "Apple developer knowledge for AI agents via MCP / CLI"
  default_prompt: "Use available Apple RAG MCP tools or the apple-rag CLI to search Apple documentation and WWDC transcripts, browse framework topics, read source pages, and answer with concise, cited guidance. Respect the server's account and quota state."

dependencies:
  tools:
    - type: "mcp"
      value: "apple-rag-mcp"
      description: "Apple Developer Documentation RAG MCP server"
      transport: "streamable_http"
      url: "https://mcp.apple-rag.com"
