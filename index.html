<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#60a5fa" />

    <script id="asset-recovery">
      (() => {
        const key = "apple-rag-asset-recovery";
        let reloading = false;
        const recover = (event) => {
          const entry = document.querySelector('script[type="module"][src]')?.getAttribute("src");
          if (!entry || reloading) return;
          const buildKey = key + ":" + entry;
          try {
            if (sessionStorage.getItem(buildKey)) return;
            sessionStorage.setItem(buildKey, "1");
          } catch {
            return;
          }
          reloading = true;
          event.preventDefault();
          window.location.reload();
        };
        window.addEventListener("vite:preloadError", recover);
        window.addEventListener("error", (event) => {
          const target = event.target;
          const source = target instanceof HTMLScriptElement && target.type === "module"
            ? target.src
            : target instanceof HTMLLinkElement && target.rel === "stylesheet" ? target.href : "";
          if (source.startsWith(window.location.origin + "/assets/")) recover(event);
        }, true);
      })();
    </script>

    <!-- Primary -->
    <title>Apple RAG MCP - Apple Docs Search, Powered by Jev</title>

    <!-- Theme -->
    <script>
      try {
        const theme = localStorage.getItem('theme') || 'system';
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const effectiveTheme = theme === 'system' ? systemTheme : theme;
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(effectiveTheme);
      } catch (_e) {
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.add(systemTheme);
      }
    </script>
