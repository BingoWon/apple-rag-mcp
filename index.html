    <script id="asset-recovery">
      (() => {
        const key = "apple-rag-asset-recovery";
        const recover = (event) => {
          if (window.__APPLE_RAG_RELOADING__) return;
          if (typeof navigator !== "undefined" && navigator.onLine === false) return;
          const entry = document.querySelector('script[type="module"][src]')?.getAttribute("src");
          if (!entry) return;
          const buildKey = key + ":" + entry;
          try {
            if (sessionStorage.getItem(buildKey)) return;
            sessionStorage.setItem(buildKey, "1");
          } catch {
            return;
          }
          window.__APPLE_RAG_RELOADING__ = true;
          event.preventDefault();
          window.location.reload();
        };
        window.addEventListener("vite:preloadError", recover);
        window.addEventListener("error", (event) => {
          const target = event.target;
          const source = target instanceof HTMLScriptElement && target.type === "module"
            ? target.src
            : target instanceof HTMLLinkElement && target.rel === "stylesheet" ? target.href : "";
          if (source.startsWith(window.location.origin + "/assets/")) recover(event);
        }, true);
      })();
    </script>

    <!-- Theme -->
    <script>
      try {
        const theme = localStorage.getItem('theme') || 'system';
        const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', isDark);
      } catch (_e) {
        document.documentElement.classList.toggle('dark', window.matchMedia('(prefers-color-scheme: dark)').matches);
      }
