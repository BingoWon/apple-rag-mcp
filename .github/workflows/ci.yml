name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: collector_test
          POSTGRES_DB: apple_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apple_rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:collector_test@127.0.0.1:5432/apple_rag_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify and build
        run: pnpm build

      - name: Verify distributable CLI in an isolated consumer
        run: node --import tsx ops/cli/verify-package.mjs
        env:
          APPLE_RAG_RELEASE_DIR: ${{ runner.temp }}/apple-rag-cli-release

      - uses: actions/upload-artifact@v4
        with:
          name: apple-rag-cli
          path: ${{ runner.temp }}/apple-rag-cli-release/*
          if-no-files-found: error

  cli-portability:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter apple-rag-cli build
      - run: pnpm --filter apple-rag-cli test

  publish-cli:
    needs: [check, cli-portability]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.1
      - uses: actions/download-artifact@v4
        with:
          name: apple-rag-cli
          path: cli-release
      - name: Check whether npm publication is needed
        id: npm
        run: node ops/cli/npm-release.mjs
      - name: Publish verified artifact with OIDC
        if: steps.npm.outputs.publish == 'true'
        run: npm publish cli-release/*.tgz --access public --provenance=false
