name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      cli_changed: ${{ steps.scope.outputs.cli_changed }}
      publish_cli: ${{ steps.scope.outputs.publish_cli }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Detect changed scopes
        id: scope
        run: |
          set -euo pipefail
          CLI_CHANGED="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CLI_CHANGED="true"
          else
            BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
            if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              CHANGED_FILES=$(git diff --name-only "$BASE" HEAD)
              if echo "$CHANGED_FILES" | grep -Eq '^(packages/cli/|worker/cli/|shared/|skills/|\.github/scripts/|pnpm-lock\.yaml)'; then
                CLI_CHANGED="true"
              fi
            else
              CLI_CHANGED="true"
            fi
          fi
          PUBLISH_CLI="false"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            OUT=$(mktemp)
            GITHUB_OUTPUT="$OUT" node .github/scripts/npm-release.mjs
            if grep -qx "publish=true" "$OUT"; then
              PUBLISH_CLI="true"
              CLI_CHANGED="true"
            fi
            rm -f "$OUT"
          fi
          echo "cli_changed=$CLI_CHANGED" >> "$GITHUB_OUTPUT"
          echo "publish_cli=$PUBLISH_CLI" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - name: Verify and build (concurrent)
        run: >-
          node .github/scripts/run-parallel.mjs
          "lint::pnpm lint"
          "tsc:web::npx tsc --noEmit -p tsconfig.json"
          "tsc:worker::npx tsc --noEmit -p worker/tsconfig.json"
          "build::pnpm build"

      - name: Verify CLI package
        if: steps.scope.outputs.cli_changed == 'true'
        run: >-
          node .github/scripts/run-parallel.mjs
          "tsc:cli::pnpm typecheck:cli"
          "build:cli::pnpm build:cli"
          && node .github/scripts/verify-cli-package.mjs
        env:
          APPLE_RAG_RELEASE_DIR: ${{ runner.temp }}/apple-rag-cli-release

      - name: Upload verified CLI artifact
        if: steps.scope.outputs.publish_cli == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: apple-rag-cli
          path: ${{ runner.temp }}/apple-rag-cli-release/*
          if-no-files-found: error

      - name: Create GitHub release for new version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/create-release.mjs

  cli-portability:
    needs: [check]
    if: needs.check.outputs.cli_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cli && node packages/cli/dist/cli.js --version && node packages/cli/dist/cli.js --help

  publish-cli:
    needs: [check, cli-portability]
    if: ${{ !failure() && !cancelled() && needs.check.outputs.publish_cli == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.1
      - uses: actions/download-artifact@v8
        with:
          name: apple-rag-cli
          path: cli-release
      - name: Verify deployed service before publishing a new CLI
        run: node .github/scripts/wait-for-service.mjs
      - name: Publish verified artifact with OIDC
        run: npm publish ./cli-release/*.tgz --access public --provenance
