#:schema node_modules/wrangler/config-schema.json

name = "apple-rag-mcp"
main = "worker/index.ts"
compatibility_date = "2026-09-02"
compatibility_flags = ["nodejs_compat", "enable_request_signal"]

keep_vars = true

[vars]
BATCH_SIZE = "30"
FORCE_UPDATE_ALL = "false"
MODEL_COST_CNY_PER_USD = "6.7152"

[placement]
mode = "smart"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/", "/connect", "/connect/", "/api/*", "/mcp*", "/oauth/cli/*", "/.well-known/*"]

[[d1_databases]]
binding = "DB"
database_name = "apple-rag-db"
database_id = "d8e71dd7-2ceb-42f7-8f57-ea732d00c768"
migrations_dir = "migrations"

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["*/5 * * * *"]
